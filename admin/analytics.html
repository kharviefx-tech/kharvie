<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kharvie Analytics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#f5f3ee;font:14px Arial,sans-serif}.wrap{width:min(1100px,94vw);margin:auto}.top{padding:18px 0;border-bottom:1px solid #292929}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.btn{display:inline-block;padding:10px 14px;border:1px solid #fff;color:#000;background:#fff;text-decoration:none;font-weight:800}.alt{background:transparent;color:#fff;border-color:#383838}.hero{padding:45px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#111;border:1px solid #292929;padding:18px}.card b{display:block;font-size:32px}.muted{color:#999}.events{margin:20px 0;display:grid;gap:10px}.event{background:#111;border:1px solid #292929;padding:15px}.event strong{color:#d8ff3e}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,90vw);background:#111;border:1px solid #292929;padding:25px}.input{width:100%;padding:12px;background:#080808;border:1px solid #333;color:#fff;margin:8px 0 14px;box-sizing:border-box}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div id="gate" class="login"><div class="box"><strong>KHARVIE® ADMIN</strong><h1>Analytics.</h1><p class="muted">Private first-party website activity.</p><form id="login"><input class="input" id="email" type="email" placeholder="Email" required><input class="input" id="password" type="password" placeholder="Password" required><button class="btn">Sign in</button></form><p id="status" class="muted"></p></div></div><div id="app" hidden><header class="top"><div class="wrap row"><strong>KHARVIE® ANALYTICS</strong><div><a class="btn alt" href="editor.html">Control room</a> <button id="logout" class="btn alt">Log out</button></div></div></header><main class="wrap"><section class="hero"><h1>What people actually do.</h1><p class="muted">Events are recorded in Supabase: page views, music-platform clicks, release/video/event clicks, booking enquiries and EPK interactions.</p><div id="stats" class="stats"></div></section><section><h2>Recent activity</h2><div id="events" class="events"></div></section></main></div><script>const db=supabase.createClient('https://dprulohylwgzmetgrywj.supabase.co','sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4');const gate=document.getElementById('gate'),app=document.getElementById('app');async function admin(){const {data:{session}}=await db.auth.getSession();if(!session)return false;const {data}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();return !!data}async function load(){const since=new Date(Date.now()-30*864e5).toISOString();const {data}=await db.from('analytics_events').select('event_name,page_path,target_url,metadata,created_at').gte('created_at',since).order('created_at',{ascending:false}).limit(500);const rows=data||[];const names=['page_view','music_platform_click','booking_enquiry_submitted','booking_click','epk_click','release_click','video_click','event_click'];document.getElementById('stats').innerHTML=names.map(n=>'<div class="card"><b>'+rows.filter(x=>x.event_name===n).length+'</b><span class="muted">'+n.replaceAll('_',' ')+'</span></div>').join('');document.getElementById('events').innerHTML=rows.slice(0,80).map(x=>'<div class="event"><strong>'+esc(x.event_name)+'</strong> · '+new Date(x.created_at).toLocaleString()+'<div class="muted">'+esc(x.page_path||'')+(x.target_url?' → '+esc(x.target_url):'')+'</div></div>').join('')||'<div class="card muted">No activity yet.</div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){if(!(await admin()))return;gate.hidden=true;app.hidden=false;load()}document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return status.textContent=r.error.message;boot()};logout.onclick=async()=>{await db.auth.signOut();location.reload()};boot();</script></body></html>
