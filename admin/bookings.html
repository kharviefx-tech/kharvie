<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kharvie Booking Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070707;--panel:#111;--line:#292929;--text:#f7f7f4;--muted:#999;--accent:#d8ff3e;--danger:#ff647c;--ok:#65e0a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{width:min(1100px,94%);margin:auto}.top{border-bottom:1px solid var(--line);padding:18px 0;position:sticky;top:0;background:#070707ee;backdrop-filter:blur(14px);z-index:5}.topin{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.15em}.btn{border:1px solid #fff;background:#fff;color:#000;padding:11px 15px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer}.btn.alt{border-color:#383838;background:transparent;color:#fff}.btn.danger{border-color:#5d2730;background:#231015;color:#ff9baa}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,8vw,78px);letter-spacing:-.07em;margin:0 0 12px}.muted{color:var(--muted);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:12px;padding-bottom:60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#202020;color:#aaa;font-size:10px;text-transform:uppercase}.badge.new{color:var(--accent)}.meta{color:#aaa;margin:10px 0}.message{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;color:#eee}.select{background:#090909;color:#fff;border:1px solid #383838;padding:10px;border-radius:9px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(430px,100%);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px}.field{margin:12px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#999;margin-bottom:6px}.field input{width:100%;padding:13px;background:#080808;border:1px solid #343434;color:#fff;border-radius:10px}.status{padding:12px;border:1px solid #333;border-radius:10px;margin-top:12px;color:#aaa}.status.error{color:#ff9baa}.status.ok{color:var(--ok)}@media(max-width:650px){.topin,.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="loginGate" class="login"><div class="loginbox"><div class="brand">KHARVIE® ADMIN</div><h1>Booking inbox.</h1><p class="muted">Private enquiries from the official Kharvie booking form.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%">Sign in</button></form><div id="loginStatus"></div></div></div><div id="app" class="hidden"><header class="top"><div class="wrap topin"><div class="brand">KHARVIE® BOOKING INBOX</div><div class="actions"><a class="btn alt" href="editor.html">Control room</a><a class="btn alt" href="../booking.html">Public booking page</a><button id="logout" class="btn alt">Log out</button></div></div></header><main class="wrap"><section class="hero"><h1>Business enquiries.</h1><p class="muted">Review every booking request, reply directly, then update its status.</p><div class="actions"><button id="refresh" class="btn">Refresh inbox</button></div></section><div id="list" class="list"></div></main></div><script>const URL='https://dprulohylwgzmetgrywj.supabase.co',KEY='sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4',db=supabase.createClient(URL,KEY);const gate=document.getElementById('loginGate'),app=document.getElementById('app'),list=document.getElementById('list');function msg(t,e=false){const x=document.getElementById('loginStatus');x.textContent=t;x.className='status '+(e?'error':'ok')}async function admin(){const {data:{session}}=await db.auth.getSession();if(!session)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await db.auth.signOut();return false}return true}async function boot(){if(!(await admin()))return;gate.classList.add('hidden');app.classList.remove('hidden');load()}async function load(){list.innerHTML='<div class="card">Loading enquiries…</div>';const {data,error}=await db.from('booking_inquiries').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card">Could not load inbox: '+esc(error.message)+'</div>';return}if(!data?.length){list.innerHTML='<div class="card">No booking enquiries yet.</div>';return}list.innerHTML=data.map(x=>'<article class="card"><div class="head"><div><strong>'+esc(x.name)+'</strong> <span class="badge '+(x.status==='new'?'new':'')+'">'+esc(x.status)+'</span><div class="meta">'+esc(x.engagement_type)+' · '+esc(x.email)+(x.phone?' · '+esc(x.phone):'')+'</div></div><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div><div class="meta">'+esc(x.company||'')+(x.location?' · '+esc(x.location):'')+(x.event_date?' · '+esc(x.event_date):'')+(x.budget_range?' · '+esc(x.budget_range):'')+'</div><div class="message">'+esc(x.message)+'</div><div class="actions" style="margin-top:15px"><a class="btn" href="mailto:'+encodeURIComponent(x.email)+'?subject='+encodeURIComponent('Re: Kharvie enquiry')+'">Reply by email</a><select class="select" data-id="'+x.id+'"><option '+(x.status==='new'?'selected':'')+'>new</option><option '+(x.status==='read'?'selected':'')+'>read</option><option '+(x.status==='replied'?'selected':'')+'>replied</option><option '+(x.status==='archived'?'selected':'')+'>archived</option></select><button class="btn danger delete" data-id="'+x.id+'">Delete</button></div></article>').join('');list.querySelectorAll('select').forEach(s=>s.onchange=async()=>{const r=await db.from('booking_inquiries').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.id);if(r.error)alert(r.error.message);else load()});list.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this enquiry?'))return;const r=await db.from('booking_inquiries').delete().eq('id',b.dataset.id);if(r.error)alert(r.error.message);else load()})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(r.error)return msg(r.error.message,true);boot()};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.getElementById('refresh').onclick=load;boot();</script></body></html>
