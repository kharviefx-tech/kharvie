<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kharvie — Unified Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050705;--panel:#0d110e;--line:#29352c;--text:#f6f7f2;--muted:#b5bdb5;--green:#21c46b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;height:100%;overflow:hidden}.bar{height:70px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#070a08}.brand{font-weight:900;letter-spacing:.14em;color:var(--green);margin-right:auto}.tab,.link{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.tab.active,.tab:hover,.link:hover{background:var(--green);color:#061008;border-color:var(--green)}#frame{width:100%;height:calc(100vh - 70px);border:0;background:var(--bg)}.gate{height:100vh;display:grid;place-items:center}.gatebox{padding:30px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center}.gatebox h1{font-size:42px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.6}.hidden{display:none!important}@media(max-width:700px){.brand{font-size:11px}.tab,.link{padding:9px;font-size:11px}.bar{overflow:auto;white-space:nowrap}}</style></head><body><div id="gate" class="gate"><div class="gatebox"><h1>Control room.</h1><p class="muted">Checking authorised admin session…</p></div></div><div id="app" class="hidden"><header class="bar"><div class="brand">KHARVIE® UNIFIED ADMIN</div><button class="tab active" data-src="settings.html">Master Settings</button><button class="tab" data-src="editor.html">Content Manager</button><button class="tab" data-src="10000-upgrades.html">15,000+ Tools</button><button class="tab" data-src="publish.html">Publishing</button><button class="tab" data-src="media.html">Media</button><a class="link" href="../index.html" target="_blank">Website</a><button id="logout" class="link">Logout</button></header><iframe id="frame" src="settings.html" title="Kharvie unified administration"></iframe></div><script>const db=supabase.createClient('https://dprulohylwgzmetgrywj.supabase.co','sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4');const gate=document.getElementById('gate'),app=document.getElementById('app'),frame=document.getElementById('frame');async function isAdmin(){const {data:{session}}=await db.auth.getSession();if(!session)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();return !error&&!!data}async function boot(){if(await isAdmin()){gate.classList.add('hidden');app.classList.remove('hidden')}else location.replace('../admin.html')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.src=b.dataset.src});document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.replace('../admin.html')};boot();</script></body></html>
