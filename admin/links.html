<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kharvie Links Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#f7f7f4;font:14px Arial}.wrap{width:min(900px,94vw);margin:auto}.top{padding:18px 0;border-bottom:1px solid #292929}.btn{padding:10px 14px;border:1px solid #fff;background:#fff;color:#000;font-weight:800}.alt{background:transparent;color:#fff;border-color:#383838}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:30px 0}.card{background:#111;border:1px solid #292929;padding:18px}.field label{display:block;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;padding:12px}.status{padding:12px;color:#65e0a0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><strong>KHARVIE® LINKS MANAGER</strong> <a class="btn alt" href="editor.html">Control room</a></div></header><main class="wrap"><h1>Official links.</h1><p>These values control platform and social links on the public website. The public site reads them from Supabase.</p><form id="form" class="grid"></form><button id="save" class="btn">Save links</button><div id="status" class="status"></div></main><script>const db=supabase.createClient('https://dprulohylwgzmetgrywj.supabase.co','sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4');const keys=['spotify_url','apple_music_url','youtube_url','instagram_url','tiktok_url','facebook_url','audiomack_url','boomplay_url','deezer_url','tidal_url','amazon_music_url','shazam_url','youtube_playlist_url'];const form=document.getElementById('form');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return location.href='editor.html';const {data:admin}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!admin)return location.href='editor.html';const {data}=await db.from('site_settings').select('setting_key,setting_value').in('setting_key',keys);const s={};(data||[]).forEach(x=>s[x.setting_key]=x.setting_value);form.innerHTML=keys.map(k=>'<div class="card field"><label>'+k.replaceAll('_',' ')+'</label><input name="'+k+'" value="'+esc(s[k]||'')+'"></div>').join('')}document.getElementById('save').onclick=async()=>{const rows=Object.fromEntries(new FormData(form).entries());const r=await db.from('site_settings').upsert(Object.entries(rows).map(([setting_key,setting_value])=>({setting_key,setting_value,updated_at:new Date().toISOString()})),{onConflict:'setting_key'});document.getElementById('status').textContent=r.error?'Save failed: '+r.error.message:'Links saved ✓'};boot();</script></body></html>
