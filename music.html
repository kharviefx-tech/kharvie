<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music | Kharvie (Victor Avannah)</title><meta name="description" content="Official music catalogue for Kharvie (Victor Avannah), including Sweet Love and official streaming destinations."><link rel="canonical" href="https://kharviefx-tech.github.io/kharvie/music.html"><link rel="icon" href="assets/kharvie.jpg"><link rel="stylesheet" href="assets/ui-v2.css?v=14"><style>main{min-height:100vh;padding:120px 6vw 70px;background:#050705;color:#f6f7f2}.music-wrap{max-width:1100px;margin:auto}.eyebrow{color:#21c46b;font-weight:800;letter-spacing:.16em;font-size:12px;text-transform:uppercase}.title{font:800 clamp(54px,9vw,110px)/.88 Manrope,system-ui,sans-serif;letter-spacing:-.08em;margin:18px 0 24px}.intro{max-width:700px;color:#b5bdb5;font-size:18px}.release{margin-top:55px;display:grid;grid-template-columns:320px 1fr;background:#0e130f;border:1px solid #29372e;border-radius:22px;overflow:hidden}.release img{width:100%;height:100%;min-height:320px;object-fit:cover}.copy{padding:38px}.copy h2{font:800 48px/.95 Manrope,sans-serif;margin:0 0 14px}.copy p{color:#b5bdb5}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.links a{display:inline-flex;align-items:center;min-height:46px;padding:0 16px;border:1px solid #354239;border-radius:12px;background:#101610;color:#f6f7f2;font-weight:800;font-size:12px}.links a:hover{background:#21c46b;color:#061008;border-color:#21c46b}.back{display:inline-flex;margin-top:28px;color:#21c46b;font-weight:800}@media(max-width:700px){.release{grid-template-columns:1fr}.release img{min-height:280px}.copy{padding:28px}}</style></head><body><main><div class="music-wrap"><div class="eyebrow">Kharvie · Official Music</div><h1 class="title">The music<br>catalogue.</h1><p class="intro">Official releases, listening destinations and release information for Kharvie, professionally known as Victor Avannah.</p><section id="release-list" class="release-list" aria-live="polite"></section><a class="back" href="./">← Back to Kharvie official website</a></div></main><script id="kharvie-release-sync">
(async()=>{try{
 const res=await fetch('releases.json?v='+Date.now(),{cache:'no-store'}); if(!res.ok)return;
 const data=await res.json(); const list=Array.isArray(data.releases)?data.releases:[]; const root=document.querySelector('#release-list'); if(!root)return;
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const platformNames={spotify:'Spotify',apple:'Apple Music',youtube:'YouTube',audiomack:'Audiomack',tidal:'TIDAL',deezer:'Deezer',amazon:'Amazon Music',pandora:'Pandora'};
 root.innerHTML=list.map((r,i)=>{
   const links=r.links||{};
   const hrefs=Object.entries(links).filter(([k,v])=>v&&platformNames[k]).map(([k,v])=>'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+platformNames[k]+'</a>').join('');
   const fallback='<a href="https://open.spotify.com/artist/1bJPpG5oB0hNvNNDUs1uAC" target="_blank" rel="noopener">Spotify</a><a href="https://music.apple.com/ng/artist/kharvie/6781999179" target="_blank" rel="noopener">Apple Music</a><a href="https://youtube.com/@kharvie-m" target="_blank" rel="noopener">YouTube</a><a href="https://audiomack.com/kharvie" target="_blank" rel="noopener">Audiomack</a>';
   return '<article class="release"><img src="'+esc(r.artwork||'assets/kharvie.jpg')+'" alt="'+esc(r.title)+' by Kharvie"><div class="copy"><div class="eyebrow">'+(r.releaseDate?'Release · '+esc(r.releaseDate):'Kharvie · Catalogue')+'</div><h2>'+esc(r.title)+'</h2><p>Official release by Kharvie. Choose a streaming destination below.</p><div class="links">'+(hrefs||fallback)+'</div></div></article>';
 }).join('');
} }catch(e){console.warn('Kharvie release sync unavailable',e)}})();
</script></body></html>
