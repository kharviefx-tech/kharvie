<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kharvie | Official Music</title><meta name="description" content="Official music catalogue for Kharvie, including official releases and streaming destinations."><link rel="canonical" href="https://kharviefx-tech.github.io/kharvie/music.html"><link rel="icon" href="assets/kharvie.jpg"><link rel="stylesheet" href="assets/ui-v2.css?v=15"><style>main{min-height:100vh;padding:120px 6vw 70px;background:#050705;color:#f6f7f2}.music-wrap{max-width:1100px;margin:auto}.eyebrow{color:#21c46b;font-weight:800;letter-spacing:.16em;font-size:12px;text-transform:uppercase}.title{font:800 clamp(54px,9vw,110px)/.88 Manrope,system-ui,sans-serif;letter-spacing:-.08em;margin:18px 0 24px}.intro{max-width:700px;color:#b5bdb5;font-size:18px}.sync-status{margin-top:16px;color:#8f9b91;font-size:12px}.release-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:42px}.release{margin-top:0;display:grid;grid-template-columns:1fr;background:#0e130f;border:1px solid #29372e;border-radius:22px;overflow:hidden}.release img{width:100%;height:320px;object-fit:cover;display:block}.artwork-placeholder{min-height:320px;display:flex;align-items:flex-end;padding:28px;background:linear-gradient(145deg,#111811,#050705);border-right:1px solid #29372e}.artwork-placeholder strong{font:800 clamp(34px,6vw,64px)/.9 Manrope,system-ui,sans-serif;letter-spacing:-.06em;color:#f6f7f2}.artwork-placeholder span{display:block;color:#21c46b;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;font-weight:800}.copy{padding:28px}.release .copy h2{font-size:40px}.release .links{margin-top:20px}.copy h2{font:800 48px/.95 Manrope,sans-serif;margin:0 0 14px}.copy p{color:#b5bdb5}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.links a{display:inline-flex;align-items:center;min-height:46px;padding:0 16px;border:1px solid #354239;border-radius:12px;background:#101610;color:#f6f7f2;font-weight:800;font-size:12px;text-decoration:none}.links a:hover{background:#21c46b;color:#061008;border-color:#21c46b}.back{display:inline-flex;margin-top:28px;color:#21c46b;font-weight:800}@media(max-width:800px){.release-list{grid-template-columns:1fr}}@media(max-width:700px){.release img{height:280px}.copy{padding:28px}}</style></head><body><main><div class="music-wrap"><div class="eyebrow">Kharvie · Official Music</div><h1 class="title">The music<br>catalogue.</h1><p class="intro">Official releases, listening destinations and release information for Kharvie.</p><div id="sync-status" class="sync-status" aria-live="polite">Loading the latest Kharvie catalogue…</div><section id="release-list" class="release-list" aria-live="polite"></section><a class="back" href="./">← Back to Kharvie official website</a></div></main><script id="kharvie-release-sync">
(async()=>{try{
 const res=await fetch('./releases.json?live='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}}); if(!res.ok)throw new Error('catalog unavailable');
 const data=await res.json(); const list=Array.isArray(data.releases)?data.releases:[]; const root=document.querySelector('#release-list'); const status=document.querySelector('#sync-status'); if(!root)return;
 if(status)status.textContent='Catalog synced · '+list.length+' releases · '+(data.updatedAt?new Date(data.updatedAt).toLocaleString():'');
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const platformNames={hyperFollow:'All platforms',smartLink:'Smart link',spotify:'Spotify',apple:'Apple Music',youtube:'YouTube',audiomack:'Audiomack',tidal:'TIDAL',deezer:'Deezer',amazon:'Amazon Music',pandora:'Pandora'};
 root.innerHTML=list.map(r=>{
   const links=r.links||{};
   const hrefs=Object.entries(links).filter(([k,v])=>v&&platformNames[k]).map(([k,v])=>'<a href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">'+platformNames[k]+'</a>').join('');
   const fallback='<a href="https://open.spotify.com/artist/1bJPpG5oB0hNvNNDUs1uAC" target="_blank" rel="noopener noreferrer">Spotify</a><a href="https://music.apple.com/ng/artist/kharvie/6781999179" target="_blank" rel="noopener noreferrer">Apple Music</a><a href="https://youtube.com/@kharvie-m" target="_blank" rel="noopener noreferrer">YouTube</a><a href="https://audiomack.com/kharvie" target="_blank" rel="noopener noreferrer">Audiomack</a>';
   const artwork=r.artwork?'<img src="'+esc(r.artwork)+'" alt="'+esc(r.title)+' by Kharvie" loading="lazy" decoding="async">':'<div class="artwork-placeholder"><div><span>Kharvie · Official Release</span><strong>'+esc(r.title)+'</strong></div></div>';
   return '<article class="release">'+artwork+'<div class="copy"><div class="eyebrow">'+(r.releaseDate?'Release · '+esc(r.releaseDate):'Kharvie · Catalogue')+'</div><h2>'+esc(r.title)+'</h2><p>Official release by Kharvie. Choose a streaming destination below.</p><div class="links">'+(hrefs||fallback)+'</div></div></article>';
 }).join('');
} catch(e){const s=document.querySelector('#sync-status');if(s)s.textContent='Music catalogue temporarily unavailable.';console.warn('Kharvie release sync unavailable',e)}})();
</script></body></html>
