<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050705"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/kharvie.jpg"><title>Kharvie — Official App</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050705;color:#f6f7f2;font-family:Inter,Arial,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}.top{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,7,5,.96);border-bottom:1px solid #29352c;z-index:10}.brand{font-weight:800;letter-spacing:.18em}.install{display:none;border:0;border-radius:999px;background:#21c46b;color:#031108;padding:9px 13px;font-weight:800;font-size:11px}.frame{flex:1;min-height:0;border:0;width:100%;background:#050705}.bar{height:66px;flex:0 0 66px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#080b08;border-top:1px solid #29352c;z-index:10}.bar a,.bar button{border:0;background:#0d110e;color:#b5bdb5;border-radius:12px;font:700 9px Inter,Arial;text-transform:uppercase;letter-spacing:.06em}.bar a.active{background:#21c46b;color:#031108}.bar button{cursor:pointer}@media(display-mode:standalone){.install{display:none}}</style></head><body><header class="top"><a class="brand" href="index.html" target="site">KHARVIE</a><button class="install" id="installBtn">INSTALL APP</button></header><iframe class="frame" name="site" src="index.html" title="Kharvie Official Website"></iframe><nav class="bar"><a class="active" href="index.html" target="site">Home</a><a href="index.html#music" target="site">Music</a><a href="index.html#videos" target="site">Videos</a><a href="app-settings.html" target="site">Settings</a></nav><script>let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installBtn').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('installBtn').style.display='none'};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(console.warn);window.addEventListener('message',e=>{if(e.data==='kharvie-install')document.getElementById('installBtn').click()});</script></body></html>
