<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kharvie | Photos</title><meta name="description" content="Official photos and gallery for Kharvie."><link rel="stylesheet" href="assets/ui-v2.css?v=20260919-photos"><style>main{max-width:1120px;margin:auto;padding:110px 20px}.photos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.photos-grid img,.photos-grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#0d110e;border:1px solid #29352c}.empty{padding:40px;border:1px solid #29352c;background:#0d110e;color:#b5bdb5}</style></head><body><header class="k-nav"><div class="wrap"><a class="logo" href="index.html">KHARVIE</a><nav><a href="index.html">Home</a><a href="music.html">Music</a><a href="videos.html">Videos</a><a href="live.html">Live</a><a href="about.html">About</a><a href="photos.html">Photos</a><a href="news.html">News</a><a href="contact.html">Contact</a><a href="press.html">EPK</a><a href="booking.html">Professional</a></nav></div></header><main><p class="k-label">OFFICIAL GALLERY</p><h1 class="k-title">Photos</h1><p class="k-copy">Official Kharvie photos and media.</p><div id="gallery" class="photos-grid"><div class="empty">Loading photos…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dprulohylwgzmetgrywj.supabase.co','sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4');async function load(){const g=document.getElementById('gallery');try{const r=await db.from('gallery').select('*').eq('is_published',true).order('created_at',{ascending:false});if(!r.data?.length){g.innerHTML='<div class="empty">No photos published yet.</div>';return}g.innerHTML=r.data.map(x=>`<img src="${x.image_url||x.url||x.media_url}" alt="${(x.title||'Kharvie photo').replaceAll('"','&quot;')}" loading="lazy">`).join('')}catch(e){g.innerHTML='<div class="empty">Gallery is temporarily unavailable.</div>'}}load();</script></body></html>
