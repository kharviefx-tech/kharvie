<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kharvie Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050705;--panel:#0d110e;--line:#29352c;--text:#f6f7f2;--muted:#b5bdb5;--green:#21c46b;--danger:#ff647c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}
.login{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px #0008}
.brand{font-weight:900;letter-spacing:.18em;color:var(--green)}
h1{font-size:clamp(42px,10vw,70px);line-height:.9;letter-spacing:-.07em;margin:25px 0 10px}
p{color:var(--muted);line-height:1.65}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#aeb8af}
.field input{width:100%;min-height:52px;padding:13px 14px;border:1px solid #39473d;border-radius:11px;background:#080b09;color:#fff;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #21c46b2e}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{min-height:48px;padding:0 17px;border-radius:11px;border:1px solid #445248;background:#0b100c;color:#f6f7f2;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.green{background:var(--green);border-color:var(--green);color:#061008}.full{width:100%}.status{display:none;margin-top:13px;padding:12px;border:1px solid #5d2730;border-radius:10px;color:#ff9baa;line-height:1.5}.status.show{display:block}.status.ok{border-color:#315f48;color:#65e0a0}
.small{font-size:11px;color:#778178;margin-top:22px}
</style>
</head>
<body>
<main class="login">
<div class="brand">KHARVIE® ADMIN</div>
<h1>Control room.</h1>
<p>Sign in to manage Kharvie's public website, music, releases, media, news, bookings, analytics and professional tools.</p>
<form id="login">
<div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn green full" type="submit">Sign in to admin</button>
</form>
<div class="actions">
<button id="reset" class="btn" type="button">Forgot password?</button>
<a class="btn" href="index.html">View website</a>
</div>
<div id="status" class="status"></div>
<div class="small">Private admin area. Access is limited to authorised Kharvie admin accounts.</div>
</main>
<script>
const db=supabase.createClient('https://dprulohylwgzmetgrywj.supabase.co','sb_publishable_gNWkc787SxA7U76No3A4kg_XHP0x2j4');
const status=document.getElementById('status');
function msg(t,ok=false){status.textContent=t;status.className='status show'+(ok?' ok':'')}
async function authorised(){
 const {data:{session}}=await db.auth.getSession();
 if(!session)return false;
 const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();
 if(error||!data){await db.auth.signOut();return false}
 return true;
}
async function boot(){if(await authorised()) location.replace('admin/editor.html')}
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault(); msg('Signing in…',true);
 const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(r.error){msg(r.error.message);return}
 if(await authorised()) location.replace('admin/editor.html'); else msg('This account is not authorised for Kharvie admin.');
});
document.getElementById('reset').addEventListener('click',async()=>{
 const e=email.value.trim(); if(!e){msg('Enter your admin email first.');return}
 const r=await db.auth.resetPasswordForEmail(e,{redirectTo:location.href});
 if(r.error)msg(r.error.message);else msg('Password reset email sent.',true);
});
boot();
</script>
</body>
</html>
