name: Sync Kharvie releases

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair public release links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- KHARVIE RELEASE LINK FIX -->'
          if marker not in s:
              fix='''\n<!-- KHARVIE RELEASE LINK FIX -->\n<style id="kharvie-release-link-fix">\n#featuredReleases a,#cmsReleases a,.featured-release-links a,.cms-release-links a{pointer-events:auto!important;touch-action:manipulation!important;position:relative!important;z-index:20!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;visibility:visible!important;opacity:1!important;color:#f6f7f2!important;background:#101610!important;border:1px solid #445248!important;border-radius:10px!important;min-height:40px!important;min-width:72px!important;padding:9px 13px!important;font-size:11px!important;line-height:1.2!important;font-weight:800!important;text-decoration:none!important;cursor:pointer!important;-webkit-tap-highlight-color:rgba(33,196,107,.28)!important}\n#featuredReleases a:hover,#cmsReleases a:hover{background:#21c46b!important;color:#061008!important;border-color:#21c46b!important}\n#featuredReleases,.k-cms-grid{position:relative!important;z-index:2!important}\n</style>\n<script>\n(function(){\n  function repair(){\n    document.querySelectorAll('#featuredReleases a,#cmsReleases a,.featured-release-links a,.cms-release-links a').forEach(function(a){\n      a.style.pointerEvents='auto';\n      a.style.visibility='visible';\n      a.style.opacity='1';\n      if(!a.textContent.trim()){\n        var h=(a.hostname||'').toLowerCase();\n        a.textContent=h.includes('spotify')?'Spotify':h.includes('apple')?'Apple Music':h.includes('youtube')?'YouTube':h.includes('audiomack')?'Audiomack':h.includes('distrokid')?'DistroKid':'Open';\n      }\n    });\n  }\n  document.addEventListener('DOMContentLoaded',repair);\n  new MutationObserver(repair).observe(document.documentElement,{subtree:true,childList:true});\n})();\n</script>\n'''
              s=s.replace('</head>',fix+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Fetch Kharvie catalogue from Apple Music
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://itunes.apple.com/lookup?id=6781999179&entity=song&limit=200" -o /tmp/itunes.json
          curl -fsSL --retry 3 "https://itunes.apple.com/lookup?id=6781999179&entity=album&limit=200" -o /tmp/itunes-albums.json

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          src=json.loads(Path('/tmp/itunes.json').read_text())
          albums=json.loads(Path('/tmp/itunes-albums.json').read_text())
          manual=json.loads(Path('release-links.json').read_text()) if Path('release-links.json').exists() else {'releases':{}}
          releases=[]
          seen=set()
          album_art={}

          for x in albums.get('results', []):
              if x.get('wrapperType') != 'collection':
                  continue
              name=x.get('collectionName')
              art=(x.get('artworkUrl100') or '').replace('100x100','1200x1200')
              if name and art:
                  album_art[name.strip().lower()]=art

          for x in src.get('results', []):
              if x.get('wrapperType') != 'track':
                  continue
              if str(x.get('artistId')) != '6781999179':
                  continue
              name=x.get('trackName') or x.get('collectionName')
              if not name:
                  continue
              key=(name.strip().lower(), (x.get('releaseDate') or '')[:10])
              if key in seen:
                  continue
              seen.add(key)
              art=(x.get('artworkUrl100') or '').replace('100x100','1200x1200')
              if not art:
                  art=album_art.get((x.get('collectionName') or '').strip().lower(),'')
              releases.append({
                  'title': name,
                  'artist': x.get('artistName','Kharvie'),
                  'releaseDate': (x.get('releaseDate') or '')[:10],
                  'genre': x.get('primaryGenreName',''),
                  'artwork': art,
                  'appleUrl': x.get('trackViewUrl') or x.get('collectionViewUrl') or '',
                  'previewUrl': x.get('previewUrl') or '',
                  'explicit': x.get('trackExplicitness') == 'explicit'
              })

          for r in releases:
              extra=manual.get('releases',{}).get(r.get('title'),{})
              if extra.get('artwork'):
                  r['artwork']=extra['artwork']
              if extra.get('releaseDate'):
                  r['releaseDate']=extra['releaseDate']
              if extra.get('genre'):
                  r['genre']=extra['genre']
              links={k:v for k,v in extra.items() if k not in {'artwork','releaseDate','genre','apple'}}
              links['apple']=r.get('appleUrl','') or extra.get('apple','')
              r['links']={k:v for k,v in links.items() if v}

          for title, extra in manual.get('releases',{}).items():
              if not any(r.get('title','').lower()==title.lower() for r in releases):
                  releases.append({
                      'title':title,
                      'artist':'Kharvie',
                      'releaseDate':extra.get('releaseDate',''),
                      'genre':extra.get('genre',''),
                      'artwork':extra.get('artwork',''),
                      'appleUrl':extra.get('apple',''),
                      'previewUrl':'',
                      'explicit':False,
                      'links':{k:v for k,v in extra.items() if k not in {'artwork','releaseDate','genre'}}
                  })

          releases.sort(key=lambda x: x.get('releaseDate',''), reverse=True)
          Path('releases.json').write_text(json.dumps({
              'artist':'Kharvie',
              'artistId':'6781999179',
              'updatedAt':datetime.now(timezone.utc).isoformat(),
              'source':'Apple/iTunes catalogue sync for DistroKid-distributed releases',
              'releases':releases
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Synced {len(releases)} Kharvie catalogue entries')
          PY

      - name: Commit catalogue and website fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json index.html
          if git diff --cached --quiet; then
            echo "No catalogue or website changes."
            exit 0
          fi
          git commit -m "Fix release links and sync Kharvie catalogue"
          git push
