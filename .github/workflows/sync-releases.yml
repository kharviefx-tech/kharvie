name: Sync Kharvie releases

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Kharvie catalog from Apple
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://itunes.apple.com/search?term=Kharvie&country=ng&media=music&entity=song&limit=100" -o /tmp/itunes.json
          curl -fsSL --retry 3 "https://itunes.apple.com/search?term=Kharvie&country=ng&media=music&entity=album&limit=100" -o /tmp/itunes-albums.json

          python - <<'PY'
          import json
          from pathlib import Path

          src=json.loads(Path('/tmp/itunes.json').read_text())
          albums=json.loads(Path('/tmp/itunes-albums.json').read_text())
          manual=json.loads(Path('release-links.json').read_text()) if Path('release-links.json').exists() else {'releases':{}}
          releases=[]
          seen=set()
          album_art={}
          for x in albums.get('results', []):
              if (x.get('artistName') or '').strip().lower() == 'kharvie':
                  name=x.get('collectionName') or x.get('trackName')
                  art=(x.get('artworkUrl100') or '').replace('100x100','1200x1200')
                  if name and art: album_art[name.strip().lower()]=art

          for x in src.get('results', []):
              artist=(x.get('artistName') or '').strip().lower()
              if artist != 'kharvie':
                  continue
              name=x.get('trackName') or x.get('collectionName')
              if (name or '').strip().lower() == 'pop' + 'sy':
                  continue
              if not name:
                  continue
              key=(name.lower(), x.get('releaseDate','')[:10])
              if key in seen:
                  continue
              seen.add(key)
              art=x.get('artworkUrl100') or ''
              art=art.replace('100x100', '1200x1200')
              if not art:
                  art=album_art.get((x.get('collectionName') or '').strip().lower(),'')
              releases.append({
                  'title': name,
                  'artist': x.get('artistName','Kharvie'),
                  'releaseDate': (x.get('releaseDate') or '')[:10],
                  'genre': x.get('primaryGenreName',''),
                  'artwork': art,
                  'appleUrl': x.get('trackViewUrl') or x.get('collectionViewUrl') or '',
                  'previewUrl': x.get('previewUrl') or '',
                  'explicit': x.get('trackExplicitness') == 'explicit'
              })

          # Preserve manually verified links AND manually verified artwork from release-links.json.
          for r in releases:
              extra=manual.get('releases',{}).get(r.get('title'),{})
              if extra.get('artwork'):
                  r['artwork']=extra['artwork']
              r['links']={k:v for k,v in {**extra, 'apple': r.get('appleUrl','') or extra.get('apple','')}.items() if k != 'artwork'}
          for title, extra in manual.get('releases',{}).items():
              if not any(r.get('title','').lower()==title.lower() for r in releases):
                  releases.append({'title':title,'artist':'Kharvie','releaseDate':'','genre':'','artwork':extra.get('artwork',''),'appleUrl':extra.get('apple',''),'previewUrl':'','explicit':False,'links':{k:v for k,v in extra.items() if k != 'artwork'}})
          releases.sort(key=lambda x: x.get('releaseDate',''), reverse=True)
          Path('releases.json').write_text(json.dumps({
              'artist':'Kharvie',
              'updatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'source':'Apple/iTunes Search',
              'releases':releases
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Synced {len(releases)} Kharvie releases')
          PY

      - name: Commit catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "Auto-sync Kharvie music catalog"
          git push
