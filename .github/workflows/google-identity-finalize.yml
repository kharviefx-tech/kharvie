name: Kharvie Google identity finalizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize public Google-facing pages
        shell: python
        run: |
          from pathlib import Path
          import re, json
          SITE='https://kharviefx-tech.github.io/kharvie/'
          pages=['index.html','about.html','artist-profile.html','kharvie-artist.html','press.html','booking.html','news.html']
          replacements={
            'KHARVIE / VICTOR AVANNAH / NIGERIA':'KHARVIE / OFFICIAL ARTIST',
            'KHARVIE VICTOR AVANNAH NIGERIA / AFROBEATS':'KHARVIE / AFROBEATS',
            'OFFICIAL WEBSITE / VICTOR AVANNAH':'OFFICIAL WEBSITE',
            'ABOUT VICTOR AVANNAH':'ABOUT KHARVIE',
            'KHARVIE / VICTOR AVANNAH':'KHARVIE',
            'Kharvie (Victor Avannah) | Official Website/Profile':'Kharvie | Official Website',
            'Kharvie (Victor Avannah)':'Kharvie',
            'a singer-songwriter from Delta State, Nigeria.':'a singer-songwriter from Delta State.',
            'is a singer-songwriter from Delta State, Nigeria.':'is a singer-songwriter from Delta State.',
            'is a singer-songwriter from Delta State.':'is a singer-songwriter from Delta State.',
            'new generation of artists':'new generation of artists',
            'From Delta State':'From Delta State',
            'Origin Delta State':'Origin Delta State',
            'Occupation singer-songwriter':'Occupation Singer-songwriter',
            'singer-songwriter':'singer-songwriter',
            'singer-songwriter':'singer-songwriter',
          }
          for name in pages:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            for old,new in replacements.items(): s=s.replace(old,new)
            s=s.replace('AFROBEATS','AFROBEATS')
            s=s.replace('Afrobeats','Afrobeats')
            p.write_text(s,encoding='utf-8')

          # Homepage is the sole primary site identity.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Kharvie | Official Website</title>','<title>Kharvie | Official Website</title>',1)
          s=re.sub(r'<link rel="canonical" href="[^"]+">','<link rel="canonical" href="'+SITE+'">',s,count=1)
          s=s.replace('New generation. Nigerian sound. In motion.','Official artist. Official music. Official identity.')
          s=s.replace('Kharvie (Victor Avannah) portrait','Kharvie — official artist portrait')
          # Keep real-name information only in explicit biography/fact context, not as the page identity.
          s=s.replace('Professionally known as Kharvie, Victor Avannah is a singer-songwriter from Delta State.','Kharvie is a singer-songwriter from Delta State.')
          p.write_text(s,encoding='utf-8')

          # Normalize JSON-LD entity identity wherever the canonical #artist is present.
          pattern=re.compile(r'<script type="application/ld\\+json">(.*?)</script>',re.S)
          def norm(m):
            try: d=json.loads(m.group(1))
            except Exception: return m.group(0)
            def walk(x):
              if isinstance(x,dict):
                if x.get('@id')==SITE+'#artist':
                  x['@type']=['Person','MusicArtist']; x['name']='Kharvie'; x['alternateName']=['Victor Avannah']; x['url']=SITE
                  x['jobTitle']=['Singer-songwriter']
                  x['sameAs']=list(dict.fromkeys(x.get('sameAs',[])))
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(d)
            return '<script type="application/ld+json">'+json.dumps(d,ensure_ascii=False,separators=(',',':'))+'</script>'
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            s=p.read_text(encoding='utf-8')
            p.write_text(pattern.sub(norm,s),encoding='utf-8')

          # Sitemap contains only public, canonical pages and uses today's date.
          pages=['','about.html','artist-profile.html','music.html','discography.html','listen.html','press.html','booking.html','news.html','releases/sweet-love.html','professional-suite.html']
          from datetime import date
          today=date.today().isoformat()
          xml=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for rel in pages:
            u=SITE if not rel else SITE+rel
            xml += [f'  <url><loc>{u}</loc><lastmod>{today}</lastmod></url>']
          xml.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(xml)+'\n',encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Kharvie | Official Website</title>' in s
          assert '<meta name="robots" content="index,follow' in s
          assert '<link rel="canonical" href="https://kharviefx-tech.github.io/kharvie/">' in s
          assert 'https://www.tiktok.com/@iamkharvie' in s
          assert 'https://www.tiktok.com/@_kharvie' not in s
          assert 'KHARVIE VICTOR AVANNAH NIGERIA' not in s
          assert 'Nigerian singer' not in s
          ET.parse('sitemap.xml')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SEO: finalize Kharvie Google identity and canonical signals'
          git push
