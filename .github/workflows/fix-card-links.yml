name: Fix card navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make all homepage action cards tappable and update SEO title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<div class="bcard"><div class="index">BOOKINGS</div>',
              '<div class="bcard hub-action" data-href="booking.html" role="link" tabindex="0" aria-label="Open booking desk"><div class="index">BOOKINGS</div>'
          )
          s = s.replace(
              '<div class="bcard dark"><div class="index">PRESS / EPK</div>',
              '<div class="bcard dark hub-action" data-href="press.html" role="link" tabindex="0" aria-label="Open EPK"><div class="index">PRESS / EPK</div>'
          )

          marker = '.bcard .btn{align-self:flex-start;margin-top:25px}'
          addition = marker + '.hub-action{cursor:pointer;transition:transform .2s,box-shadow .2s}.hub-action:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(0,0,0,.12)}.hub-action:focus-visible{outline:2px solid var(--lime);outline-offset:4px}'
          if marker in s and '.hub-action{cursor:pointer' not in s:
              s = s.replace(marker, addition, 1)

          script_end = "window.addEventListener('scroll',()=>document.querySelector('.nav')?.classList.toggle('scrolled',scrollY>30));"
          extra = script_end + "document.querySelectorAll('.hub-action').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('a'))return;location.href=card.dataset.href});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a')){e.preventDefault();location.href=card.dataset.href}})});"
          if script_end in s and 'document.querySelectorAll(\'.hub-action\')' not in s:
              s = s.replace(script_end, extra, 1)

          s = s.replace('<title>Kharvie | Official Website</title>', '<title>Kharvie | Official Website</title>')
          s = s.replace('<meta name="author" content="Kharvie (Victor Avannah)">', '<meta name="author" content="Kharvie">')
          s = s.replace('<meta property="og:site_name" content="Kharvie (Victor Avannah) Official">', '<meta property="og:site_name" content="Kharvie">')
          s = s.replace('<meta property="og:title" content="Kharvie — Victor Avannah">', '<meta property="og:title" content="Kharvie | Official Website">')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Set Kharvie official website title"
            git push
          fi
