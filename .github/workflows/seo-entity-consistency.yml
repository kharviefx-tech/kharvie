name: Kharvie SEO and Entity Consistency

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Kharvie's canonical Google entity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from datetime import date

          ROOT = Path('.')
          SITE = 'https://kharviefx-tech.github.io/kharvie/'
          ENTITY = SITE + '#artist'

          replacements = {
              'https://www.tiktok.com/@_kharvie': 'https://www.tiktok.com/@iamkharvie',
              'https://www.facebook.com/share/19RdXwa2nU/': 'https://www.facebook.com/officialKharvie',
              SITE + '#person': ENTITY,
          }

          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in {'.html', '.txt', '.json', '.xml', '.yml', '.yaml'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          # Parse and normalize every JSON-LD block so Kharvie has one canonical entity.
          pattern = re.compile(r'<script type="application/ld\+json">(.*?)</script>', re.S)

          def normalize_node(node):
              if not isinstance(node, dict):
                  return
              if node.get('@id') == ENTITY and node.get('@type'):
                  node['@type'] = ['Person', 'MusicArtist']
                  node['name'] = 'Kharvie'
                  node['alternateName'] = ['Victor Avannah']
                  node.pop('member', None)
                  node['jobTitle'] = ['Singer', 'Songwriter']
                  node['url'] = SITE
                  node['description'] = 'Kharvie is the professional artist name of Victor Avannah, a singer and songwriter from Delta State.'
              for v in node.values():
                  if isinstance(v, dict):
                      normalize_node(v)
                  elif isinstance(v, list):
                      for item in v:
                          if isinstance(item, dict):
                              normalize_node(item)

          for p in ROOT.rglob('*.html'):
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              def replace_ld(match):
                  try:
                      doc = json.loads(match.group(1))
                  except Exception:
                      return match.group(0)
                  normalize_node(doc)
                  return '<script type="application/ld+json">' + json.dumps(doc, separators=(',', ':'), ensure_ascii=False) + '</script>'

              updated = pattern.sub(replace_ld, s)
              if updated != s:
                  p.write_text(updated, encoding='utf-8')

          # Keep Kharvie dominant across every managed public page. The real name remains available only where biography/context requires it.
          for rel in ['index.html','about.html','artist-profile.html','kharvie-artist.html','press.html','booking.html','news.html']:
              p = ROOT / rel
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = s.replace('Kharvie (Victor Avannah) | Official Website/Profile','Kharvie | Official Website')
                  s = s.replace('Kharvie (Victor Avannah)','Kharvie')
                  s = s.replace('Nigerian singer and songwriter','singer and songwriter')
                  s = s.replace('Nigerian singer-songwriter','singer-songwriter')
                  s = s.replace('Nigerian ','')
                  s = s.replace('Nigeria','')
                  s = s.replace('Delta State, .','Delta State.')
                  p.write_text(s, encoding='utf-8')

          # Rebuild sitemap from canonical public pages only. Redirect aliases and legal/admin utility pages stay out.
          public_pages = [
              '', 'about.html', 'artist-profile.html', 'kharvie-artist.html',
              'music.html', 'discography.html', 'listen.html', 'press.html',
              'booking.html', 'news.html', 'releases/sweet-love.html',
              'professional-suite.html'
          ]
          today = date.today().isoformat()
          xml = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for rel in public_pages:
              url = SITE if not rel else SITE + rel
              xml += ['  <url>', f'    <loc>{url}</loc>', f'    <lastmod>{today}</lastmod>', '  </url>']
          xml.append('</urlset>')
          (ROOT / 'sitemap.xml').write_text('\\n'.join(xml) + '\\n', encoding='utf-8')
          PY

      - name: Validate SEO files and structured data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          json.loads(Path('site.webmanifest').read_text(encoding='utf-8'))
          index = Path('index.html').read_text(encoding='utf-8')
          assert '<title>Kharvie | Official Website</title>' in index
          assert '<meta name="robots" content="index,follow' in index
          assert 'https://kharviefx-tech.github.io/kharvie/#artist' in index
          assert '#person' not in index
          assert '#victor-avannah' not in index
          assert '"@type":["Person","MusicArtist"]' in index
          assert '"name":"Kharvie"' in index
          assert 'https://www.tiktok.com/@iamkharvie' in index
          assert 'https://www.tiktok.com/@_kharvie' not in index
          assert 'https://kharviefx-tech.github.io/kharvie/#artist' in index
          assert 'https://www.facebook.com/officialKharvie' in index
          assert 'https://www.facebook.com/share/19RdXwa2nU/' not in index
          assert 'https://kharviefx-tech.github.io/kharvie/sitemap.xml' in Path('robots.txt').read_text(encoding='utf-8')
          print('Kharvie SEO/entity validation passed.')
          PY

      - name: Commit normalized site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No SEO/entity changes required.'
          else
            git commit -m 'Strengthen Kharvie canonical Google entity signals'
            git push
          fi
