name: Build Kharvie public experience layer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-experience-layer.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public experience layer safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- KHARVIE-PRO-PUBLIC-V1 -->'
          if marker in s:
              print('Public experience layer already installed')
              raise SystemExit(0)
          css=r'''<style id="kharvie-pro-public-css">
          .kp-wrap{width:min(1500px,92vw);margin:auto}.kp-section{padding:96px 0;border-top:1px solid rgba(244,242,236,.14)}.kp-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:30px}.kp-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8d8a82}.kp-title{font:700 clamp(42px,7vw,86px)/.9 Manrope,sans-serif;letter-spacing:-.08em;margin:8px 0}.kp-copy{max-width:650px;color:#9b9a92}.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kp-card{border:1px solid rgba(244,242,236,.14);background:#10110f;border-radius:18px;padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.kp-card h3{margin:0 0 8px;font-size:22px}.kp-card p{margin:0;color:#9b9a92}.kp-link{display:inline-flex;margin-top:18px;padding:10px 13px;border:1px solid #41433d;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.kp-link:hover{background:#d8ff3e;color:#080807;border-color:#d8ff3e}.kp-release-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kp-release-card{background:#e9e5db;color:#10110f;border-radius:18px;padding:34px;min-height:320px;display:flex;flex-direction:column;justify-content:end}.kp-release-card p{color:#67645d}.kp-pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.kp-pill{border:1px solid #aaa69d;padding:9px 11px;font-size:9px;text-transform:uppercase;font-weight:800}.kp-commercial{background:#e9e5db;color:#10110f;border-radius:22px;padding:38px}.kp-commercial .kp-copy{color:#68655e}.kp-commercial-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px}.kp-commercial a{padding:18px;border:1px solid #aaa69d;font-weight:800;font-size:11px}.kp-commercial a:hover{background:#10110f;color:#fff}.kp-social{display:flex;flex-wrap:wrap;gap:8px}.kp-social a{padding:12px 14px;border:1px solid #30332e;border-radius:10px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.kp-access{position:fixed;right:16px;bottom:16px;z-index:900;background:#d8ff3e;color:#080807;border:0;border-radius:999px;padding:12px 15px;font-weight:900;cursor:pointer;box-shadow:0 12px 30px #0008}.kp-tools{display:none;position:fixed;right:16px;bottom:70px;z-index:901;background:#111510;border:1px solid #374238;border-radius:15px;padding:15px;width:220px}.kp-tools.open{display:block}.kp-tools button{display:block;width:100%;margin:5px 0;padding:10px;background:#0a0c0a;color:#fff;border:1px solid #343a35;border-radius:8px;cursor:pointer;text-align:left}.kp-tools button:hover{background:#d8ff3e;color:#080807}.kp-high-contrast{filter:contrast(1.18)}.kp-large-text{font-size:112%}
          @media(max-width:850px){.kp-grid,.kp-release-grid{grid-template-columns:1fr 1fr}.kp-commercial-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.kp-section{padding:70px 0}.kp-grid,.kp-release-grid{grid-template-columns:1fr}.kp-commercial-grid{grid-template-columns:1fr}.kp-commercial{padding:25px}.kp-head{display:block}}
          </style>'''
          html=r'''<!-- KHARVIE-PRO-PUBLIC-V1 --><section class="kp-section" id="pro-music"><div class="kp-wrap"><div class="kp-head"><div><div class="kp-label">01 / Catalogue</div><h2 class="kp-title">The music.</h2></div><p class="kp-copy">Explore official releases, streaming profiles, lyrics, credits and the growing Kharvie catalogue.</p></div><div class="kp-release-grid"><div class="kp-release-card"><div class="kp-label">Featured release</div><h3 style="font-size:38px;margin:8px 0">Sweet Love</h3><p>Official release information and listening links.</p><div class="kp-pills"><a class="kp-pill" href="https://open.spotify.com/track/3a6qAo7biXN6Hu5LU1NocG" target="_blank" rel="noopener">Spotify</a><a class="kp-pill" href="https://music.apple.com/ng/artist/kharvie/6781999179" target="_blank" rel="noopener">Apple Music</a><a class="kp-pill" href="https://youtube.com/@kharvie-m" target="_blank" rel="noopener">YouTube</a></div></div><div class="kp-release-card"><div class="kp-label">Full catalogue</div><h3 style="font-size:38px;margin:8px 0">Music archive</h3><p>Releases, tracks, lyrics, credits and official platform destinations.</p><a class="kp-link" href="music.html">Open music catalogue →</a></div></div></div></section><section class="kp-section" id="pro-media"><div class="kp-wrap"><div class="kp-head"><div><div class="kp-label">02 / Visuals</div><h2 class="kp-title">Watch Kharvie.</h2></div><p class="kp-copy">Official videos, performances, studio moments, visualizers and short-form content.</p></div><div class="kp-grid"><div class="kp-card"><div><h3>Official YouTube</h3><p>Music videos, uploads and official visual stories.</p></div><a class="kp-link" href="https://youtube.com/@kharvie-m" target="_blank" rel="noopener">Watch →</a></div><div class="kp-card"><div><h3>Short-form</h3><p>Follow the latest TikTok and social video activity.</p></div><a class="kp-link" href="https://www.tiktok.com/@iamkharvie" target="_blank" rel="noopener">TikTok →</a></div><div class="kp-card"><div><h3>Media archive</h3><p>Professional imagery and press resources for industry use.</p></div><a class="kp-link" href="press.html">Open EPK →</a></div></div></div></section><section class="kp-section" id="pro-story"><div class="kp-wrap"><div class="kp-head"><div><div class="kp-label">03 / Artist</div><h2 class="kp-title">The story.</h2></div><p class="kp-copy">A clear artist identity for fans, media, promoters and industry visitors.</p></div><div class="kp-grid"><div class="kp-card"><h3>Kharvie</h3><p>Professionally known as Kharvie, Victor Avannah is a Nigerian singer-songwriter from Delta State.</p><a class="kp-link" href="about.html">Read about →</a></div><div class="kp-card"><h3>EPK & press</h3><p>Biography, photos, professional information and media resources.</p><a class="kp-link" href="press.html">Open EPK →</a></div><div class="kp-card"><h3>News & updates</h3><p>Announcements, releases, appearances and artist updates.</p><a class="kp-link" href="news.html">View news →</a></div></div></div></section><section class="kp-section" id="pro-business"><div class="kp-wrap"><div class="kp-commercial"><div class="kp-label">04 / Work with Kharvie</div><h2 class="kp-title">Professional opportunities.</h2><p class="kp-copy">For bookings, collaborations, media, brand opportunities and licensing enquiries.</p><div class="kp-commercial-grid"><a href="booking.html#enquiry">Live performances</a><a href="booking.html#enquiry">Music collaborations</a><a href="booking.html#enquiry">Media & press</a><a href="booking.html#enquiry">Brand opportunities</a><a href="booking.html#enquiry">Licensing</a></div><a class="kp-link" href="booking.html">Open professional booking desk →</a></div></div></section><section class="kp-section" id="pro-social"><div class="kp-wrap"><div class="kp-head"><div><div class="kp-label">05 / Official profiles</div><h2 class="kp-title">Stay connected.</h2></div><p class="kp-copy">Use the official profiles below for Kharvie's latest music, videos and updates.</p></div><div class="kp-social"><a href="https://www.instagram.com/kharvie__/" target="_blank" rel="noopener">Instagram</a><a href="https://www.tiktok.com/@iamkharvie" target="_blank" rel="noopener">TikTok</a><a href="https://youtube.com/@kharvie-m" target="_blank" rel="noopener">YouTube</a><a href="https://open.spotify.com/artist/1bJPpG5oB0hNvNNDUs1uAC" target="_blank" rel="noopener">Spotify</a><a href="https://music.apple.com/ng/artist/kharvie/6781999179" target="_blank" rel="noopener">Apple Music</a><a href="https://audiomack.com/kharvie" target="_blank" rel="noopener">Audiomack</a><a href="https://www.boomplay.com/share/artist/133955596" target="_blank" rel="noopener">Boomplay</a><a href="https://www.facebook.com/officialKharvie" target="_blank" rel="noopener">Facebook</a></div></div></section><section class="kp-section" id="pro-contact"><div class="kp-wrap"><div class="kp-card" style="min-height:260px"><div><div class="kp-label">06 / Contact</div><h2 class="kp-title">Let's work.</h2><p class="kp-copy">Booking, media, collaborations and professional opportunities.</p></div><div><a class="kp-link" href="booking.html">Start an enquiry →</a> <a class="kp-link" href="mailto:avannahvictor3@gmail.com">Email directly →</a></div></div></div></section><button class="kp-access" id="kpAccess" aria-label="Accessibility tools">Accessibility</button><div class="kp-tools" id="kpTools" aria-label="Accessibility tools"><button id="kpContrast">Increase contrast</button><button id="kpText">Larger text</button><button id="kpReset">Reset display</button></div>'''
          js=r'''<script id="kharvie-pro-public-js">(()=>{const a=document.getElementById('kpAccess'),t=document.getElementById('kpTools');if(!a||!t)return;a.addEventListener('click',()=>t.classList.toggle('open'));document.getElementById('kpContrast').onclick=()=>document.body.classList.toggle('kp-high-contrast');document.getElementById('kpText').onclick=()=>document.body.classList.toggle('kp-large-text');document.getElementById('kpReset').onclick=()=>{document.body.classList.remove('kp-high-contrast','kp-large-text');t.classList.remove('open')};})();</script>'''
          if '</body>' not in s:
              raise SystemExit('index.html has no closing body tag; no changes made')
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',html+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Installed public experience layer')
          PY
      - name: Commit generated homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add professional public artist experience layer'
          git push
