name: Keep Kharvie public site clean
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-experience-layer.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove injected public experience layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- KHARVIE-PRO-PUBLIC-V1 -->'
          if marker in s:
              s=s[:s.index(marker)] + s[s.index('</body>'):]
          s=re.sub(r'<style id="kharvie-pro-public-css">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<script id="kharvie-pro-public-js">.*?</script>', '', s, flags=re.S)
          p.write_text(s,encoding='utf-8')
          print('Public experience layer removed; public artist layout preserved.')
          PY
      - name: Commit clean public homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove duplicated public music and tools sections'
          git push
