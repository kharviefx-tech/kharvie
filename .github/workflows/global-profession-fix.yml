name: Global entity consistency cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-profession-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: clean global artist entity data') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Kharvie entity data globally
        run: |
          git checkout ad5fd5e840c31e52fd68d50ca62b0bab2f8accd1 -- index.html
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          replacements={
            'Nigerian singer-songwriter and recording artist':'Nigerian singer and songwriter',
            'singer-songwriter and recording artist':'Nigerian singer and songwriter',
            'singer-songwriter':'Nigerian singer and songwriter',
            'Singer &amp; songwriter':'Nigerian Singer and Songwriter',
            'Singer & songwriter':'Nigerian Singer and Songwriter',
            '"jobTitle":["Singer","Songwriter","Recording Artist"]':'"jobTitle":"Nigerian Singer and Songwriter"',
            '"jobTitle":["Singer","Songwriter"]':'"jobTitle":"Nigerian Singer and Songwriter"',
            'Profession: Nigerian singer and songwriter':'Profession: Nigerian Singer and Songwriter',
            'Profession: singer and songwriter':'Profession: Nigerian Singer and Songwriter',
            'profession: singer and songwriter':'profession: Nigerian Singer and Songwriter',
            'Delta State, "':'Delta State, Nigeria"',
            'Delta State, .':'Delta State, Nigeria.',
            'Delta State, .</':'Delta State, Nigeria.</',
            'Delta State, </':'Delta State, Nigeria</',
            'Delta State, </strong>':'Delta State, Nigeria</strong>',
            '"name":"Delta State, "':'"name":"Delta State, Nigeria"',
            '"name":""':'"name":"Nigeria"',
            '"nationality":{"@type":"Country","name":""}':'"nationality":{"@type":"Country","name":"Nigeria"}',
            '"jobTitle":["Singer","Songwriter","Recording Artist"]':'"jobTitle":"Nigerian Singer and Songwriter"',
            '"jobTitle":["Singer","Songwriter"]':'"jobTitle":"Nigerian Singer and Songwriter"',
            'Occupation</b><span>Singer and songwriter':'Occupation</b><span>Nigerian Singer and Songwriter',
            'Occupation</b><span>Singer &amp; songwriter':'Occupation</b><span>Nigerian Singer and Songwriter',
            'id="factOrigin">Delta State, </':'id="factOrigin">Delta State, Nigeria</',
            'id="factProfession">singer and songwriter</':'id="factProfession">Nigerian Singer and Songwriter</',
          }
          for p in root.rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.txt','.json','.md','.js','.sql','.xml'}:
              continue
            try: s=p.read_text(encoding='utf-8')
            except Exception: continue
            old=s
            for a,b in replacements.items(): s=s.replace(a,b)
            if s!=old: p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Kharvie App Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean global artist entity data' || exit 0
          git push
