name: Enable Kharvie PWA
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'sw.js'
      - 'app.html'
      - 'app-settings.html'
      - 'assets/link-fix.js'
      - '.github/workflows/enable-pwa.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  pwa:
    if: ${{ !contains(github.event.head_commit.message, 'chore: enable Kharvie PWA') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep private admin controls out of public index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<section id="website-settings"')
          if start != -1:
              depth=0
              end=None
              for m in re.finditer(r'</?section\b[^>]*>',s[start:],re.I):
                  tag=m.group(0)
                  if tag.startswith('</'):
                      depth-=1
                      if depth==0:
                          end=start+m.end()
                          break
                  else:
                      depth+=1
              if end:
                  s=s[:start]+s[end:]
          s=re.sub(r'\s*<a[^>]+href=["\']#website-settings["\'][^>]*>\s*Settings\s*</a>','',s,flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Inject PWA and public link hooks into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          manifest='<link rel="manifest" href="manifest.json">'
          sw='<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.warn));}</script>'
          links='<script src="assets/link-fix.js" defer></script>'
          if 'rel="manifest" href="manifest.json"' not in s:
              s=s.replace('<link rel="icon" href="assets/kharvie.jpg">','<link rel="icon" href="assets/kharvie.jpg">'+manifest,1)
          if 'serviceWorker.register("sw.js")' not in s:
              s=s.replace('</body>',sw+'</body>',1)
          if 'assets/link-fix.js' not in s:
              s=s.replace('</body>',links+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate public index
        run: |
          ! grep -q 'id="website-settings"' index.html
          ! grep -q 'href="#website-settings"' index.html
          grep -q 'Kharvie | Official Website' index.html
      - name: Commit PWA and public cleanup
        run: |
          git config user.name 'Kharvie App Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: enable Kharvie PWA'
          git push
