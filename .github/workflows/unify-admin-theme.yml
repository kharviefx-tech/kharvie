name: Unify Kharvie admin theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Kharvie theme overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/editor.html')
          s=p.read_text()
          s=s.replace('background:#f5f5f2','background:#21c46b').replace('border-color:#f5f5f2','border-color:#21c46b').replace('color:#050505','color:#061008')
          s=s.replace('background:#fff','background:#0d110e').replace('border-color:#fff','border-color:#445248').replace('color:#000','color:#f6f7f2')
          s=s.replace('background:#151515;border-color:#444;color:#fff','background:#21c46b;border-color:#21c46b;color:#061008')
          s=s.replace('background:rgba(7,7,7,.95)','background:#070a08')
          s=s.replace('backdrop-filter:blur(16px)','backdrop-filter:none')
          s=s.replace('--accent:#5f9f78;--accent2:#4b8061','--accent:#21c46b;--accent2:#27d878')
          marker='</head>'
          css='''<style id="kharvie-final-theme">html,body{background:#050705!important;color:#f6f7f2!important;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important}h1,h2,h3,h4,.brand,.single-top strong{font-family:Manrope,system-ui,sans-serif!important;color:#f6f7f2!important}.top,.tabs,.single-top,.single-sidebar{background:#070a08!important;border-color:#29352c!important;backdrop-filter:none!important}.single-board,.single-content{background:#050705!important}.single-nav button,.single-nav a,.tab,.btn,.button{background:#0d110e!important;color:#f6f7f2!important;border-color:#29352c!important}.single-nav button:hover,.single-nav a:hover,.single-nav .active,.tab.active,.btn.accent,.btn.green,.admin-board .primary{background:#21c46b!important;color:#061008!important;border-color:#21c46b!important}.card,.row,.stat,.metric,.chart-card,.tool,.insight,.notice,.empty{background:#0d110e!important;color:#f6f7f2!important;border-color:#29352c!important}.field input,.field textarea,.field select{background:#080b09!important;color:#f6f7f2!important;border-color:#39473d!important}.field input:focus,.field textarea:focus,.field select:focus{border-color:#21c46b!important;box-shadow:0 0 0 3px rgba(33,196,107,.18)!important}.field label,.muted,.small,.stat span,.metric .k,.tool span,.insight span{color:#b5bdb5!important}.showPass{background:#121813!important;color:#f6f7f2!important;border-color:#39473d!important}.bar{background:#182119!important}.bar i{background:#21c46b!important}.admin-nav-label{color:#21c46b!important}</style>'''
          if 'id="kharvie-final-theme"' not in s:
              s=s.replace(marker,css+marker)
          p.write_text(s)
          PY
      - name: Commit theme
        run: |
          git config user.name 'Kharvie Theme Bot'
          git config user.email 'actions@github.com'
          git add admin/editor.html
          git diff --cached --quiet || git commit -m 'fix: enforce Kharvie website theme on admin board'
          git push