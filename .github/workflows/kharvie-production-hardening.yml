name: Kharvie Production Hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'production hardening complete') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize homepage identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'<script type="application/ld\+json">(.*?)</script>', re.S)
          match = pattern.search(s)
          if match:
              data = json.loads(match.group(1))
              graph = data.get('@graph', [])
              artist = next((x for x in graph if isinstance(x, dict) and x.get('@id') == 'https://kharviefx-tech.github.io/kharvie/#artist'), None)
              if artist:
                  artist['@type'] = 'Person'
                  artist['name'] = 'Kharvie'
                  artist['alternateName'] = ['Victor Avannah', 'Kharvie (Victor Avannah)']
                  for key in ('member','foundingLocation','foundingDate','genre','disambiguatingDescription'):
                      artist.pop(key, None)
                  page = next((x for x in graph if isinstance(x, dict) and x.get('@type') == 'WebPage'), None)
                  if page:
                      page['mainEntity'] = {'@id': artist['@id']}
                      page['about'] = {'@id': artist['@id']}
                  website = next((x for x in graph if isinstance(x, dict) and x.get('@type') == 'WebSite'), None)
                  if website:
                      website['publisher'] = {'@id': artist['@id']}
                  data['@graph'] = graph
                  replacement = '<script type="application/ld+json">' + json.dumps(data, separators=(',', ':'), ensure_ascii=False) + '</script>'
                  s = s[:match.start()] + replacement + s[match.end():]

          s = re.sub(r'<title>.*?</title>', '<title>Kharvie | Official Website</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta property="og:title"[^>]*>', '<meta property="og:title" content="Kharvie | Official Website">', s, count=1)
          s = re.sub(r'<meta name="twitter:title"[^>]*>', '<meta name="twitter:title" content="Kharvie | Official Website">', s, count=1)
          s = s.replace('https://www.tiktok.com/@_kharvie', 'https://www.tiktok.com/@iamkharvie')
          s = s.replace('https://www.facebook.com/share/19RdXwa2nU/', 'https://www.facebook.com/officialKharvie')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate homepage
        run: |
          grep -q 'Kharvie | Official Website' index.html
          grep -q '"@type":"Person"' index.html
          grep -q '"name":"Kharvie"' index.html
          grep -q 'https://www.tiktok.com/@iamkharvie' index.html

      - name: Commit production hardening
        run: |
          git config user.name 'Kharvie Production Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage already normalized.'
            exit 0
          fi
          git commit -m 'production hardening complete'
          git push
