name: Kharvie Production Hardening
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/kharvie-production-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'chore: production hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production SEO, PWA and public-site safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          public = [p for p in root.glob('*.html') if p.name not in {
              'admin.html','app-settings.html','google-site-verification.html','404.html'
          }]
          public += list(root.glob('releases/*.html'))

          for p in public:
              s = p.read_text(encoding='utf-8')
              rel = '../assets/site-core.js' if p.parent.name == 'releases' else 'assets/site-core.js'
              tag = f'<script src="{rel}" defer></script>'
              if rel not in s and '</body>' in s:
                  s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')

          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Kharvie | Official Website</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta property="og:title"[^>]*>', '<meta property="og:title" content="Kharvie | Official Website">', s, count=1)
          s = re.sub(r'<meta name="twitter:title"[^>]*>', '<meta name="twitter:title" content="Kharvie | Official Website">', s, count=1)

          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
          if m:
              try:
                  data = json.loads(m.group(1))
                  graph = data.get('@graph', [])
                  artist = next((x for x in graph if x.get('@id','').endswith('#artist')), None)
                  if artist:
                      artist.clear()
                      artist.update({
                          '@type':'Person',
                          '@id':'https://kharviefx-tech.github.io/kharvie/#artist',
                          'name':'Victor Avannah',
                          'alternateName':['Kharvie','Kharvie (Victor Avannah)'],
                          'description':'Kharvie, professionally known as Victor Avannah, is a Nigerian singer-songwriter and recording artist from Delta State, Nigeria.',
                          'url':'https://kharviefx-tech.github.io/kharvie/',
                          'image':[
                              'https://kharviefx-tech.github.io/kharvie/assets/kharvie.jpg',
                              'https://kharviefx-tech.github.io/kharvie/assets/IMG-20260912-WA0004.jpg'
                          ],
                          'birthDate':'2003-04-12',
                          'birthPlace':{'@type':'Place','name':'Delta State, Nigeria'},
                          'nationality':{'@type':'Country','name':'Nigeria'},
                          'jobTitle':['Singer','Songwriter'],
                          'sameAs':[
                              'https://www.youtube.com/@kharvie-m',
                              'https://www.instagram.com/kharvie__/',
                              'https://www.facebook.com/officialKharvie',
                              'https://www.tiktok.com/@iamkharvie',
                              'https://open.spotify.com/artist/1bJPpG5oB0hNvNNDUs1uAC',
                              'https://music.apple.com/ng/artist/kharvie/6781999179',
                              'https://audiomack.com/kharvie',
                              'https://www.boomplay.com/share/artist/133955596',
                              'https://www.deezer.com/en/artist/397699251',
                              'https://tidal.com/artist/81354709/u',
                              'https://music.amazon.com/artists/B0H62J7XW9/kharvie',
                              'https://www.shazam.com/artist/-/6781999179'
                          ]
                      })
                  webpage = next((x for x in graph if x.get('@type')=='WebPage'), None)
                  if webpage:
                      webpage['mainEntity']={'@id':'https://kharviefx-tech.github.io/kharvie/#artist'}
                      webpage['about']={'@id':'https://kharviefx-tech.github.io/kharvie/#artist'}
                      webpage['dateModified']='2026-09-20'
                  website = next((x for x in graph if x.get('@type')=='WebSite'), None)
                  if website:
                      website['publisher']={'@id':'https://kharviefx-tech.github.io/kharvie/#artist'}
                  data['@graph'] = graph
                  new = '<script type="application/ld+json">' + json.dumps(data, separators=(',',':'), ensure_ascii=False) + '</script>'
                  s = s[:m.start()] + new + s[m.end():]
              except Exception as e:
                  print('Schema hardening skipped:', e)
          index.write_text(s, encoding='utf-8')
          PY
      - name: Commit production hardening
        run: |
          git config user.name 'Kharvie Production Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site-core.js *.html releases/*.html robots.txt sitemap.xml || true
          git diff --cached --quiet || git commit -m 'chore: production hardening'
          git push
