name: Update official TikTok link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old TikTok profile everywhere
        run: |
          old='https://www.tiktok.com/@iamkharvie'
          new='https://www.tiktok.com/@iamkharvie'
          files=$(git grep -Il "$old" || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs -r sed -i "s#${old}#${new}#g"
          fi

      - name: Commit updated TikTok links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'TikTok links are already correct.'
            exit 0
          fi
          git add -A
          git commit -m 'Fix official TikTok profile link'
          git push
